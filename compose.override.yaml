services:
  ###> doctrine/doctrine-bundle ###
  database:
    restart: no
    ports:
      - "13306:3306"
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME}_dev
      MARIADB_USER: ${DATABASE_USER}_dev
    volumes:
      - database_data_dev:/var/lib/mysql
  ###< doctrine/doctrine-bundle ###

  database_test:
    restart: no
    extends:
      file: compose.yaml
      service: database
    ports:
      - "13307:3306"
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME}_test
      MARIADB_USER: ${DATABASE_USER}_test
    volumes:
      - database_data_test:/var/lib/mysql

  webserver:
    restart: no
    volumes:
      - ./:/app
    networks:
      - mailpit

  # Used to publish the application
  deployer:
    image: idmarinas/deployer:8.4
    privileged: true
    healthcheck:
      test: php -v || exit 1
    volumes:
      - ./:/app
      - /var/lib/docker  # Volumen anónimo temporal
      ## SSH
      - ssh_key:/root/.ssh

volumes:
  database_data_dev:
  database_data_test:
  docker_dev_data:
  ssh_key:
    external: true

networks:
  mailpit:
    external: true
