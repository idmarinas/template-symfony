services:
  ###> doctrine/doctrine-bundle ###
  database:
    restart: on-failure
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME}_dev
      MARIADB_USER: ${DATABASE_USER}_dev
    volumes:
      - database_data_dev:/var/lib/mysql
  ###< doctrine/doctrine-bundle ###

  database_test:
    restart: on-failure
    extends:
      file: compose.yaml
      service: database
    ports: !reset [ ]
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME}_test
      MARIADB_USER: ${DATABASE_USER}_test
    volumes:
      - database_data_test:/var/lib/mysql

  caddy:
    restart: on-failure
    volumes:
      # Global config
      - .docker/caddy/globals/dev.Caddyfile:/etc/caddy/globals/Caddyfile:ro
      # Snippets
      - .docker/caddy/snippets/dev.Caddyfile:/etc/caddy/snippets/Caddyfile:ro
    tty: true
    depends_on: !override
      - php
      - database
      - database_test

  php:
    restart: on-failure
    image: idmarinas/php:8.4-xdebug
    expose:
      - 9000
    volumes:
      - ./.docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
      ## SSH
      - ssh_key:/root/.ssh:ro

  ###> symfony/mailer ###
  mailer:
    restart: on-failure
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  ###< symfony/mailer ###

volumes:
  database_data_dev:
  database_data_test:
  ssh_key:
    external: true
