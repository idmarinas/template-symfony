exception:
  oops: '¡Ups!'
  button: Página principal
  information:
    title: 'Información adicional'
    text: 'El servidor devolvió un "status_code status_text"'
  error:
    title: 'Se ha producido un error'
    text: |
      En el Reino van como locos (...más si es posible) no saben que hacer con tu petición.
      Se ha producido un error (quién lo iba a decir)
      Pero no te preocupes, el error ha quedado registrado... puede ser... quien sabe... cosas de la magia...

      También puedes indicarnos que es lo que estabas haciendo cuando paso este desafortunado error.
      Lo solucionaremos lo antes posible y desde Draconia sienten las molestias causadas.
  401:
    title: Sin autorización
    text: |
      La gente de Draconia se junta en la entrada al Reino formando una valla de humanos, elfos, orcos...
      Gritando "¡¡NOO... PUEEEDEES... PASAAR!!" y golpeando el suelo con sus bastones.
      Valla, parece que sin el santo y seña no podrás entrar al Reino.
  404:
    title: 'Página no encontrada'
    text: |
      Valla, parece que el Dragón está juguetón y ha escondido la página que buscabas.
      Por ese motivo no encontramos lo que buscas, o... tal vez...
      ¿Te has equivocado al escribir la página?
  500:
    title: Error interno de Draconia
    text: |
      La gente de Draconia ha perdido la cabeza (no literalmente)
      Y ha pasado algo que nadie pensaba que iba a pasar...
      Sí Draconia ha sufrido un error interno.
