symfonycasts_tailwind:
    # Specify the EXACT version of Tailwind CSS you want to use
    binary_version: 'v4.1.12'
    input_css:
        # APP Default:
        - '%kernel.project_dir%/assets/styles/app/app.css'
        # Web:
        - '%kernel.project_dir%/apps/web/assets/styles/web.css'
        # Others
        - '%kernel.project_dir%/assets/styles/exception_error.css'

    # Alternatively, you can specify the path to the binary that you manage yourself
    #binary: 'node_modules/.bin/tailwindcss'
